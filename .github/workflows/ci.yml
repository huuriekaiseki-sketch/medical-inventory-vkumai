name: CI

# WHY(paths-ignore をやめた、2026-09-18・issue #783): 以前はここで docs/** 等を除外していたが、
# **workflow ごと起動しない**ので docs だけの PR では 1 ジョブも回らなかった。ところが docs を読む
# 検査は多い——hooks-test の check-catalogs / check-session-handoff-format 等に加え、vitest 側も
# escaped-defects・privileged-writes・table_registry・role_registry が docs をルールブックとして
# 実際に読む。結果、PR #781（docs のみ）が違反 2 件を main へ通した。**検査は在ったが起動しなかった。**
# いまは workflow は必ず起動し、**重いジョブだけ** changes の判定で省く（無料枠の狙いは維持）。
# 判定の正本は scripts/lib/classify-changed-paths.mjs（ここに条件を書き写さない）。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # WHY(issue #783): 「この PR は重いジョブを省いてよいか」だけを答える軽量ジョブ。
  # 判定そのものは scripts/lib/classify-changed-paths.mjs が持ち、hooks-test で守られている
  # （scripts/check-ci-path-filter.test.sh）。判定できないときは code=true に倒す＝全部回す。
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # base...head の diff を取るため
      - id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # WHY: pull_request 以外（workflow_dispatch）は base が無いので、判定せず全部回す
          if [ -z "${BASE_SHA:-}" ] || [ -z "${HEAD_SHA:-}" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "base/head が無いので全ジョブを回します"
            exit 0
          fi
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > /tmp/changed.txt || true
          node scripts/lib/classify-changed-paths.mjs --files /tmp/changed.txt | tee /tmp/classified.txt
          grep '^code=' /tmp/classified.txt >> "$GITHUB_OUTPUT"

  typecheck:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: typecheck

  lint:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: lint

  # WHY(条件を付けない、issue #783): vitest は docs をルールブックとして**実際に読む**
  # （escaped-defects.test.ts / privileged-writes.test.ts / table_registry / role_registry）。
  # docs だけの PR でこれを省くと、台帳の未処理・棚卸しのずれがそのまま main へ入る。
  test:
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: test

  # WHY: typecheckが通ってもNext.jsの本番ビルド(next build)だけが失敗するケース
  # (静的生成時のエラー等)はこれまでCIで検知できなかった。派生リポジトリ(riff-gear)では
  # buildジョブが標準構成のため、本家にも同じ検知を持たせる。
  # ローカル検証済み: env無し(.env.local不在)でも next build は成功する。
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    uses: ./.github/workflows/node-check.yml
    with:
      run-script: build

  # WHY: .claude/settings.json / .codex/hooks.json から呼ばれるhook・ガードスクリプトには
  # 回帰テスト(scripts/**/*.test.sh、39本)があるが、npm test(vitest)にもCIにも載っておらず
  # 全て手動実行依存だった(docs/agents/observability-internals.md にも明記)。これは
  # 「起動トリガーは機械にする」(issue #411)の原則に検知網自身が反している状態のため、
  # 派生リポジトリ(riff-gear)で実証済みのhooks-testジョブを逆輸入して全件を機械実行する。
  # Codex設定分離の検証(codex-config-separation.test.sh等、対応スクリプトを持たない
  # 設定検証テスト)もこのジョブで初めて機械化される。
  # WHY: 本番依存（--omit=dev）に high 以上の既知脆弱性が無いことを毎 PR で固定する（2026-09-04、
  # docs/agents/known-failure-patterns.md「依存関係層」）。npm audit が緑でも「安全の証明」ではなく
  # 公開済み脆弱性に当たっていないことの確認に過ぎない。依存追加の理由は PreToolUse hook
  # （check-dependency-change.sh）と引き継ぎメモ 00「依存の変更」が別途担う。
  dependency-audit:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'  # 版の正本は .nvmrc（issue #775）
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  # WHY(条件を付けない、issue #783): docs を見る検査がこのジョブに集まっている
  # （check-catalogs・check-session-handoff-format・棚卸し系・check-harness-map 等）。
  # ここを省いた結果が PR #781 の違反 2 件だったので、changes の判定に**かけない**。
  hooks-test:
    runs-on: ubuntu-latest
    steps:
      # WHY(fetch-depth: 0): scripts/check-secret-leak-history.test.sh は git のオブジェクト全部を
      # 走査して「一度でも秘密をコミットしていないか」を見る。既定の浅い clone（depth 1）では
      # 走査対象がほぼ無く、**0 件だから安全**と読める緑になってしまう。
      # 検査自体も浅い clone を検知して落ちるので、ここで深さを指定しないと CI が止まる。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # WHY(node と依存を入れる、2026-09-18): scripts/check-fixture-guard.test.sh は
      # 「teardown の throw で実行が落ちるか」を思い込みで書かないため、vitest と playwright を
      # 実際に起動して測る（node_modules/.bin/ を直接呼ぶ）。依存が無ければ黙って飛ばさず
      # 「前提を測れない」と言って落ちる設計なので、このジョブにも npm ci が要る。
      # ブラウザ本体は不要（プローブは page を使わない spec）。
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'  # 版の正本は .nvmrc（issue #775）
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      # 認証ファイル漏洩チェック（BSGではなくCI側で行う方針）。e2e.ymlがPR自動実行を
      # やめた(2026-08-25、無料枠対応)ため、PRごとに回る本ジョブへ移設した(軽量・数秒)
      - name: Check auth state files are not committed
        run: |
          leaked=$(git ls-files 'e2e/.auth' | grep -v '\.gitkeep$' || true)
          if [ -n "$leaked" ]; then
            echo "::error::e2e/.auth 配下に認証ファイルがコミットされています: $leaked"
            exit 1
          fi
      # WHY(ロケールを明示する、2026-09-10・レビュー指摘 R12): 検査は日本語でメッセージを出すのに、
      # 実行ロケールを誰も決めていなかった。bash 3.2 + UTF-8 では `"$VAR）"` の全角文字の
      # 先頭バイトを変数名の一部と読んで `set -u` で落ちるため、**C ロケールで回すと 117/0、
      # ja_JP.UTF-8 で回すと 101/16** という差が出ていた（2026-09-10 実測）。
      # 開発者の手元は UTF-8 なので、CI もそちらに合わせる。
      # 書き方そのものの検査は scripts/check-shell-locale-safety.test.sh。
      - name: Run hook script regression tests
        env:
          LC_ALL: C.UTF-8
          LANG: C.UTF-8
        run: |
          for t in scripts/*.test.sh scripts/lib/*.test.sh; do
            echo "::group::$t"
            bash "$t"
            echo "::endgroup::"
          done

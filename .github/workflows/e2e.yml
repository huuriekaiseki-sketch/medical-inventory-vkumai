name: E2E Smoke Tests

# WHY: PRごとの自動実行はPlaywright+ローカルSupabase起動で1回あたりの消費分数が最大級で、
# Actions無料枠枯渇(2026-08)の主因だったため、mainへのpush後と手動起動のみに変更した。
# PR段階のE2Eはローカル実行(npm run test:e2e)で代替する。
# RLS/IDOR integrationテストについては、**高リスクパスに触れたPRに限り**
# integration-gate.yml がPR時点で必須ゲートとして走る（全PRではないので消費分数は抑えられる）。
# それ以外のPRおよび内容ベースの高リスク判定は、引き続き .claude/rules/db-schema.md の
# ローカル実行義務に依存する。認証ファイル漏洩チェックはPRごとに回る
# ci.ymlのhooks-testジョブへ移設した。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'  # ローカル開発環境に合わせる（node -v で確認）
          cache: 'npm'

      - name: Install dependencies
        run: npm ci   # ロックファイルどおりに展開（依存解決を省く。node-check.yml のコメント参照）

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # WHY: e2e/env-guard.ts のデフォルト許可ホストは127.0.0.1/localhostのみ。
      #      本番Supabaseの接続情報がCIに一切渡らないよう、GitHub Secretsは使わず
      #      ローカルSupabaseを起動してその場で発行される接続情報だけを使う。
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Verify generated Supabase types
        run: bash scripts/check-generated-supabase-types.sh

      - name: Export local Supabase connection info
        run: |
          echo "SUPABASE_API_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Run RLS/IDOR integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Run E2E smoke tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          # WHY: ダミーデータ規約（docs/agents/common.md）に合わせた固定のテスト用メール。
          #      ローカルSupabaseは毎回まっさらな状態なので機密情報ではなくsecrets化不要
          E2E_TEST_EMAIL: e2e-test-user@example.com

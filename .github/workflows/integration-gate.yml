name: RLS/DB Integration Gate

# WHY: RLS/IDOR統合テスト(npm run test:integration)は e2e.yml で回っているが、
# トリガーが push:[main] のみのため **マージ前に壊れたRLS変更を止められない**
# （mainへ入った後で初めて鳴る火災報知器になっている）。
#
# 一方で全PRでローカルSupabase起動を伴うジョブを回すと、Actions無料枠の枯渇
# （2026-08、e2e.yml をPRトリガーから外した理由）を再発させる。
#
# 折衷として、docs/agents/common.md「TRI/RISK 機械判定基準」の高リスクパスに
# 触れたPRだけをゲート対象にする。Playwrightのインストールとe2e実行は行わず、
# 統合テストのみを走らせることで、e2e.yml より消費分数を抑える。
#
# 既知の限界: paths フィルタはファイルパスしか見られないため、TRI/RISK基準のうち
# 「auth / facility / tenant / organization / inventory / RLS / policy に関わる変更」
# という**内容ベースの判定は表現できない**。パスで表せる範囲のみをここでゲートし、
# 内容ベースの判定は引き続き .claude/rules/db-schema.md のローカル実行義務に依存する。
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/__tests__/**'
      - 'src/lib/supabase/**'
      - '**/middleware.ts'
      - '**/proxy.ts'   # middleware.tsの後継（Next.js 16、issue #681）。移行期間中の互換のためmiddleware.tsも残す
      - '.github/workflows/integration-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'  # ローカル開発環境に合わせる（node -v で確認）
          cache: 'npm'

      - name: Install dependencies
        run: npm ci   # ロックファイルどおりに展開（依存解決を省く。node-check.yml のコメント参照）

      - uses: supabase/setup-cli@v3
        with:
          version: latest

      # WHY: e2e/env-guard.ts のデフォルト許可ホストは127.0.0.1/localhostのみ。
      #      本番Supabaseの接続情報がCIに一切渡らないよう、GitHub Secretsは使わず
      #      ローカルSupabaseを起動してその場で発行される接続情報だけを使う。
      - name: Start local Supabase
        run: |
          supabase start
          supabase db reset

      - name: Verify generated Supabase types
        run: bash scripts/check-generated-supabase-types.sh

      - name: Export local Supabase connection info
        run: |
          echo "SUPABASE_API_URL=$(supabase status -o json | jq -r '.API_URL')" >> "$GITHUB_ENV"
          echo "SUPABASE_ANON_KEY=$(supabase status -o json | jq -r '.ANON_KEY')" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$(supabase status -o json | jq -r '.SERVICE_ROLE_KEY')" >> "$GITHUB_ENV"

      - name: Run RLS/IDOR integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.SUPABASE_API_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}

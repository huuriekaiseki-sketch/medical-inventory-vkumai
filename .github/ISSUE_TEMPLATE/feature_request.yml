name: 機能要望
description: 新機能・改善の提案
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 解決したい課題
      description: 今何に困っているか、なぜこれが必要か
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 提案する解決策
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 検討した代替案
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: 補足
    validations:
      required: false

# ローカルSupabase（supabase start）の設定。未記載の項目はCLIデフォルトが使われる。
project_id = "medical-inventory-vkumai"

[auth]
# E2Eは baseURL=http://localhost:3000 で動くため、マジックリンク検証後のリダイレクト先を
# localhost に揃える（デフォルトの http://127.0.0.1:3000 だとCookieドメインが127.0.0.1になり、
# localhostでアクセスするテストに認証が引き継がれない）
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "http://localhost:3000/**"]

# CLIデフォルトはTOTP MFAのenroll/verifyが無効。ローカルでMFA機能を検証できるよう有効化する。
# 本番(Supabase Dashboard)側は別途手動でMFA(TOTP)を有効化する必要がある(このファイルの設定は
# ローカル開発専用で本番には反映されない)。
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# custom_access_token_hook(20260805000002マイグレーション)をローカルで有効化する。
# 本番(Supabase Dashboard > Authentication > Hooks)側は別途手動設定が必要
# (このファイルの設定はローカル開発専用で本番には反映されない)。
[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/public/custom_access_token_hook"
